name: Deploy board

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo-status-board
        uses: actions/checkout@v4

      - name: Checkout on-the-record
        uses: actions/checkout@v4
        with:
          repository: tokenmaxxxer/on-the-record
          path: _boards/on-the-record

      - name: Checkout tokenmaxxxer-core
        uses: actions/checkout@v4
        with:
          repository: tokenmaxxxer/tokenmaxxxer-core
          path: _boards/tokenmaxxxer-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rsb
        run: pip install -e .

      - name: Generate board.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: rsb --config .github/boards.ci.toml --json --allow-partial --timeout 240 > board.json

      - name: Assemble Pages site
        run: |
          mkdir -p _site/api
          cp -r src/rsb/web/* _site/
          cp board.json _site/api/board.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.RSB_ALERT_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "RSB_ALERT_WEBHOOK not set; skipping failure notification"
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"repo-status-board deploy-board build job failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK_URL"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.RSB_ALERT_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "RSB_ALERT_WEBHOOK not set; skipping failure notification"
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"repo-status-board deploy-board deploy job failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK_URL"
